name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run validate

      - run: bun run pack:all

      - name: Verify ZIP integrity
        run: |
          for f in artifacts/*.zip; do
            echo "Testing $f"
            unzip -t "$f" > /dev/null || { echo "ZIP test failed: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: artifacts/
