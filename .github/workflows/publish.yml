name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: store-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "${{ github.event.release.tag_name }}" origin/main; then
            echo "Tag is not on main"
            exit 1
          fi

      - name: Verify tag format
        run: |
          tag="${{ github.event.release.tag_name }}"
          if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag $tag does not match vX.Y.Z"
            exit 1
          fi

      - name: Verify release is not a prerelease
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "Prereleases are not published"
            exit 1
          fi

      - name: Verify release body is non-empty
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$(printf '%s' "$RELEASE_BODY" | tr -d '[:space:]')" ]; then
            echo "Release body is empty"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          pkg_version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$pkg_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json version $pkg_version != tag version"
            exit 1
          fi

      - run: bun run validate

      - run: bun run pack:all

      - name: Verify ZIP integrity
        run: |
          for f in artifacts/*.zip; do
            unzip -t "$f" > /dev/null || { echo "ZIP test failed: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-bundle
          path: artifacts/

  release-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-bundle
          path: artifacts/

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in artifacts/*.zip; do
            gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
          done

  publish-chrome:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-bundle
          path: artifacts/

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and publish to Chrome Web Store
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          VERSION: ${{ needs.build.outputs.version }}
          ZIP: artifacts/youtube-ultrawide-crop-v${{ needs.build.outputs.version }}-chrome.zip
        run: |
          set -euo pipefail

          ITEM="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"
          API="https://chromewebstore.googleapis.com/v2/$ITEM"
          UPLOAD_API="https://chromewebstore.googleapis.com/upload/v2/$ITEM"

          # 1. Fetch current status
          STATUS=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            "$API:fetchStatus")
          echo "$STATUS"

          # 2. Stop on takedown or warnings
          if [ "$(echo "$STATUS" | jq -r '.takenDown // false')" = "true" ]; then
            echo "Item is taken down"
            exit 1
          fi
          if [ "$(echo "$STATUS" | jq -r '.warned // false')" = "true" ]; then
            echo "Item has an active warning"
            exit 1
          fi

          # 3. Skip if same version already published or submitted
          PUBLISHED=$(echo "$STATUS" | jq -r \
            '([.publishedItemRevisionStatus.distributionChannels[]?.crxVersion] | first) // empty')
          PENDING=$(echo "$STATUS" | jq -r \
            '([.submittedItemRevisionStatus.distributionChannels[]?.crxVersion] | first) // empty')
          if [ "$PUBLISHED" = "$VERSION" ] || [ "$PENDING" = "$VERSION" ]; then
            echo "Version $VERSION already published or submitted; skipping"
            exit 0
          fi

          # 4. Fail if a different version is under review
          if [ -n "$PENDING" ] && [ "$PENDING" != "$VERSION" ]; then
            echo "Version $PENDING is under review; cannot submit $VERSION"
            exit 1
          fi

          # 5. Upload the Chrome ZIP
          UPLOAD=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ZIP" \
            "$UPLOAD_API:upload")
          echo "$UPLOAD"

          UPLOAD_STATE=$(echo "$UPLOAD" | jq -r '.uploadState')

          # 6. Poll if asynchronous
          if [ "$UPLOAD_STATE" = "IN_PROGRESS" ]; then
            echo "Upload in progress, polling..."
            for i in $(seq 1 60); do
              sleep 5
              POLL=$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $TOKEN" \
                "$API:fetchStatus")
              UPLOAD_STATE=$(echo "$POLL" | jq -r '.lastAsyncUploadState // "IN_PROGRESS"')
              echo "Poll $i: lastAsyncUploadState=$UPLOAD_STATE"
              if [ "$UPLOAD_STATE" = "SUCCEEDED" ]; then
                break
              fi
              if [ "$UPLOAD_STATE" = "FAILED" ] || [ "$UPLOAD_STATE" = "NOT_FOUND" ]; then
                echo "Async upload failed: $UPLOAD_STATE"
                exit 1
              fi
            done
          fi

          if [ "$UPLOAD_STATE" != "SUCCEEDED" ]; then
            echo "Upload failed: $UPLOAD_STATE"
            exit 1
          fi

          # 7. Publish with review enabled
          PUBLISH=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"publishType":"DEFAULT_PUBLISH","skipReview":false,"blockOnWarnings":true}' \
            "$API:publish")
          echo "$PUBLISH"

          echo "Chrome v$VERSION submitted for review"

  publish-firefox:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: verified-release-bundle
          path: artifacts/

      - name: Write AMO metadata with release notes
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          jq -n --arg notes "$RELEASE_NOTES" \
            '{version: {release_notes: {"en-US": $notes}}}' \
            > /tmp/amo-metadata.json

      - name: Submit to AMO
        run: |
          rm -rf dist-firefox
          unzip -q \
            "artifacts/youtube-ultrawide-crop-v${RELEASE_VERSION}-firefox.zip" \
            -d dist-firefox

          bunx web-ext sign \
            --source-dir dist-firefox \
            --artifacts-dir artifacts \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --channel listed \
            --upload-source-code "artifacts/youtube-ultrawide-crop-v${RELEASE_VERSION}-source.zip" \
            --amo-metadata /tmp/amo-metadata.json \
            --timeout 600000 \
            --approval-timeout 0 \
            --no-input
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
